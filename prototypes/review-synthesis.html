<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>评审与方案整合 · 开发流程工作台</title>
<style>
:root{--ink:#17283d;--muted:#657386;--navy:#15273f;--blue:#245aca;--line:#dbe2eb;--paper:#f5f6f8;--amber:#94591d;--pale:#fff6e6;--green:#28705c}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.65 "Microsoft YaHei UI","PingFang SC",sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.43}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid #79a4ed;outline-offset:3px}
header{background:var(--navy);color:#fff;padding:23px max(4vw,24px);display:flex;justify-content:space-between;align-items:center;border-bottom:4px solid #426caa}.brand{font-size:18px;font-weight:700;letter-spacing:.05em}.eyebrow{font:11px/1.5 Consolas,monospace;letter-spacing:.17em;color:#b5c7e5}.mode{font-size:12px;border:1px solid #637c9a;padding:4px 11px;border-radius:3px;color:#e1eaff}
main{max-width:1350px;margin:0 auto;padding:32px 24px 48px}.intro{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:25px}.intro h1{font:700 30px/1.35 "DengXian","Microsoft YaHei",sans-serif;margin:5px 0 9px;letter-spacing:.02em}.intro p{margin:0;color:var(--muted);font-size:14px}.project-stamp{font:12px/1.7 Consolas,monospace;color:var(--muted);text-align:right;overflow-wrap:anywhere;max-width:40%}
.steps{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);background:#fff;margin-bottom:20px}.step{padding:16px 20px;display:flex;align-items:center;gap:12px;border-right:1px solid var(--line)}.step:last-child{border:0}.step .num{font:24px/1 Consolas,monospace;color:#a1afc1}.step.active{background:#edf3ff;box-shadow:inset 0 -3px var(--blue)}.step.active .num,.step.done .num{color:var(--blue)}.step strong{font-size:14px}.step small{display:block;font-size:11px;color:var(--muted)}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 285px;gap:20px;align-items:start}.workspace{min-width:0}.tabs{display:flex;gap:2px;background:#e9edf3;padding:5px;border:1px solid var(--line);margin-bottom:15px;flex-wrap:wrap}.tabs button{border:0;background:transparent;color:var(--muted);padding:8px 17px;font-weight:600;font-size:13px}.tabs button[aria-selected=true]{background:white;color:var(--blue);box-shadow:0 1px 4px #12233e12}
.panel{border:1px solid var(--line);background:white;padding:24px;margin-bottom:16px;min-width:0}.panel h2{font-size:18px;margin:0 0 5px}.panel h3{font-size:15px;margin:0 0 8px}.section-top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:17px}.kicker{color:var(--blue);font:11px Consolas,monospace;letter-spacing:.12em}.muted{color:var(--muted);font-size:13px}.empty{padding:42px 26px;border:1px dashed #b7c7dd;background:#fafcff;text-align:center;margin-top:20px}.empty h3{font-size:20px;margin:0 0 9px}.empty p{max-width:510px;margin:0 auto 16px;color:var(--muted);font-size:14px}.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid #c4d0e0;background:#fff;color:var(--ink);padding:8px 13px;border-radius:4px;font-size:13px;font-weight:600}.btn.primary{background:var(--blue);border-color:var(--blue);color:white}.btn.subtle{background:#f1f5fb;border-color:transparent;color:#315886}.btn.danger{color:#9a4038}.btn.small{font-size:12px;padding:4px 9px}.badge{display:inline-block;padding:2px 8px;border:1px solid #dbe5f5;background:#f0f5ff;font-size:11px;color:#355886;border-radius:3px}.badge.amber{background:var(--pale);color:var(--amber);border-color:#eddbb8}.badge.green{background:#eef8f3;color:var(--green);border-color:#c9e6d7}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:14px}.draft{border:1px solid var(--line);padding:18px;min-width:0}.draft .letter{font:700 27px Georgia,serif;color:var(--blue);margin-right:10px}.draft-title{display:flex;align-items:center;margin-bottom:12px}.draft p{font-size:13px;margin:8px 0;color:#4f6076}.claim{border-left:2px solid #9ab4dc;padding:5px 0 5px 12px;margin:13px 0;font-size:13px;overflow-wrap:anywhere}.refs{font:11px/1.6 Consolas,"Microsoft YaHei",monospace;color:#607491;margin:5px 0}.source-row{padding:12px 0;border-bottom:1px solid #edf0f5;font-size:13px}.source-row:last-child{border:0}.source-row strong{display:block}.source-row p{margin:5px 0}
pre{font:13px/1.8 Consolas,"Microsoft YaHei",monospace;white-space:pre-wrap;overflow-wrap:anywhere;margin:10px 0;background:#f5f7fb;padding:15px;border:1px solid #e4eaf3}details{margin-top:16px}summary{cursor:pointer;color:#365d90;font-size:13px}aside{position:sticky;top:20px;background:#fff;border:1px solid var(--line);border-top:3px solid var(--navy);padding:21px}aside h2{font-size:17px;margin:5px 0 14px}aside p{font-size:13px;color:#5b6b80;margin:11px 0}aside .btn{width:100%;margin:5px 0;text-align:center}aside .rule{border-top:1px solid var(--line);margin:18px 0;padding-top:15px}.choice{display:flex;align-items:center;gap:9px;padding:9px 10px;border:1px solid var(--line);margin:7px 0;font-size:13px}.choice:has(input:checked){border-color:#9bb9ec;background:#f0f5ff}.choice input{accent-color:var(--blue)}
.score-row{padding:14px 0;border-bottom:1px solid #edf0f5}.score-row:last-child{border:0}.score-heading{display:flex;justify-content:space-between;align-items:center}.score{font:26px/1.3 Consolas,monospace;color:var(--blue)}.score small{font-size:12px;color:#8594a7}.score-row p{font-size:12px;color:var(--muted);margin:7px 0}.notice{border-left:3px solid #c78a3b;background:var(--pale);padding:12px 15px;color:#795326;font-size:13px;margin:14px 0}.notice.blue{background:#f0f5ff;border-color:#658ac2;color:#395c88}
.editor-card{border:1px solid var(--line);padding:18px;margin:14px 0;background:#fcfdff}.editor-card.open{border-left:3px solid #c3914b}.row-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}label.field{display:block;font-size:12px;color:#607089;margin:10px 0}label.field input,label.field textarea{display:block;width:100%;margin-top:5px;border:1px solid #c8d3e1;background:white;padding:9px;color:var(--ink);border-radius:3px}textarea{resize:vertical}input[disabled],textarea[disabled]{background:#f2f4f7!important;color:#637185!important}.check{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);margin:10px 0}.editor-card textarea{min-height:72px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:20px}.md-editor{display:block;width:100%;font:13px/1.75 Consolas,"Microsoft YaHei",monospace;min-height:290px;border:1px solid #c8d3e1;padding:15px}
#error:not(:empty){margin-bottom:16px;border:1px solid #edc5bb;color:#913f30;background:#fff2ed;padding:12px 16px;font-size:13px;overflow-wrap:anywhere}#status{font-size:12px;color:var(--green);min-height:22px;margin:8px 0}.history-row{display:flex;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);align-items:center;font-size:13px}.record{padding:13px 0;border-bottom:1px solid #edf0f5;font-size:13px}.record p{margin:6px 0;color:var(--muted);font-size:12px}.json-input{width:100%;min-height:160px;margin-top:10px;font:12px/1.6 Consolas,monospace;padding:12px;border:1px solid #c8d3e1}.hidden{display:none!important}footer{color:#8693a3;font-size:11px;margin-top:20px;display:flex;justify-content:space-between;gap:16px}
@media(max-width:1000px){.layout{grid-template-columns:minmax(0,1fr) 245px}.panel{padding:19px}.step{padding:13px 12px;gap:8px}.step .num{font-size:20px}}
@media(max-width:760px){main{padding:22px 14px}.layout{grid-template-columns:1fr}aside{position:static;order:-1}.two-col{grid-template-columns:1fr}.intro{align-items:flex-start}.intro h1{font-size:24px}.project-stamp{display:none}.steps{grid-template-columns:1fr 1fr}.step{border-bottom:1px solid var(--line)}.tabs button{padding:8px 11px}.section-top{align-items:flex-start;flex-wrap:wrap}.panel{padding:17px}header{padding:17px}.brand{font-size:16px}.intro p{font-size:12px}}
@media(prefers-reduced-motion:no-preference){.panel{animation:appear .22s ease-out}@keyframes appear{from{opacity:.5;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}}
html.embedded header,html.embedded .steps,html.embedded .intro{display:none}
html.embedded main{padding-top:18px}
aside [aria-label='主理人检查与干预'] select{width:100%;font:inherit}
aside .notice p{overflow-wrap:anywhere}
.editor-card.open{scroll-margin-top:14px}
</style>
</head>
<body>
<header><div><div class="eyebrow">SE DEVELOPMENT PROCESS AGENT</div><div class="brand">开发流程工作台</div></div><span class="mode">本地模拟 · 评审与整合</span></header>
<main>
 <div class="intro"><div><div class="kicker">REVIEW / SYNTHESIS</div><h1>让每一项取舍，都有据可查。</h1><p>独立评价，保留分歧，经人工确认后交付下一阶段。</p></div><div class="project-stamp" id="project-stamp">等待导入交接材料</div></div>
 <nav class="steps" aria-label="评审阶段" id="steps"></nav>
 <div id="error" role="alert"></div><div id="status" role="status" aria-live="polite"></div>
 <div class="layout"><div class="workspace"><div class="tabs" role="tablist" aria-label="工作区视图" id="tabs"></div><div id="content" role="tabpanel"></div></div><aside id="supervisor" aria-label="阶段主理与操作"></aside></div>
 <footer><span>HSX · 评审与方案整合原型</span><span>演示数据仅保留在本次服务会话内，重启后清空。</span></footer>
</main>
<script>
const $=id=>document.getElementById(id);
const embedded = window.parent !== window && new URLSearchParams(location.search).has('embedded');
if (embedded) document.documentElement.classList.add('embedded');
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone=x=>JSON.parse(JSON.stringify(x));
let project=null,tab='handoff',busy=false,selection='merge',buffer=null,historic=null,dirty=false;
let inspection=null, feedbackGroup='A', feedbackNote='';
const refs=x=>`<div class="refs">${(x||[]).map(esc).join(' · ')}</div>`;
const badge=(text,style='')=>`<span class="badge ${style}">${esc(text)}</span>`;
const activeSpec=()=>historic||project?.specification;
const readOnly=()=>!!historic;
const splitRefs=text=>text.split(/[,，、\s]+/).filter(Boolean);
function setProject(data){if(project?.id!==data.id){feedbackNote='';feedbackGroup='A';}inspection=null;project=data;historic=null;buffer=data.specification?clone(data.specification):null;dirty=false;selection=data.specification?.selection||selection;render();}
async function api(path,body){
 const response=await fetch(path,body===undefined?{cache:'no-store'}:{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
 const data=await response.json();
 if(!response.ok){const e=data.error;throw new Error(`${e.message}${e.details?.path?'（'+e.details.path+'）':''}${e.details?.current_version!==undefined?' 当前版本 v'+e.details.current_version+'；请保留编辑内容后刷新。':''}`);}
 return data;
}
async function operate(fn){
 if(busy)return;busy=true;$('error').textContent='';$('status').textContent='正在处理…';
 const buttons=[...document.querySelectorAll('button,input,textarea,select')].map(el=>[el,el.disabled]);buttons.forEach(([el])=>el.disabled=true);
 try{await fn();return true;}catch(e){$('error').textContent=e.message;$('status').textContent='操作未完成，当前编辑内容保留。';return false;}
 finally{busy=false;buttons.forEach(([el,disabled])=>{if(el.isConnected)el.disabled=disabled;});}
}
async function sample(name){await operate(async()=>{const data=await api('/preview/examples/'+name);setProject(await api('/preview/projects',data));tab='handoff';render();$('status').textContent=name==='cly'?'已导入 CLY 实际生成的交接样例。':'已加载已有预约取舍案例。';});}
async function importData(text){await operate(async()=>{const data=JSON.parse(text.replace(/^\uFEFF/,''));setProject(await api('/preview/projects',data));tab='handoff';render();$('status').textContent='交接材料已导入，请开始独立评审。';});}
async function action(name,body={}){await operate(async()=>{const data=await api(`/preview/projects/${project.id}/actions/${name}`,body);setProject(data);tab=name==='evaluate'?'evaluation':'spec';render();$('status').textContent={evaluate:'两份独立评价已生成。',propose:'已生成新草稿，请核对正文和决策。',save:'人工编辑已保存为新版本。',confirm:'方案已确认，可以导出交接材料。'}[name];});}
function markDirty(){inspection=null;dirty=true;$('status').textContent='有未保存编辑，请核对正文和结构化条目后保存。';if($('version-select'))$('version-select').disabled=true;renderSide();}
function field(collection,index,key,label,value,multiline=false,disabled=false){return `<label class="field">${esc(label)}${multiline?`<textarea rows="3" data-collection="${collection}" data-index="${index}" data-key="${key}" ${disabled?'disabled':''}>${esc(value)}</textarea>`:`<input data-collection="${collection}" data-index="${index}" data-key="${key}" value="${esc(value)}" ${disabled?'disabled':''}>`}</label>`;}
function handoff(){
 let html=`<section class="panel"><div class="section-top"><div><div class="kicker">01 / HANDOFF</div><h2>从同一份需求开始</h2><div class="muted">保留原文、行号和主张来源，接收 CLY 导出的 JSON。</div></div>${badge(project?'已导入':'等待材料')}</div><div class="actions"><button class="btn primary" data-action="sample-conflict">加载取舍演示</button><button class="btn" data-action="sample-cly">加载 CLY 样例</button><button class="btn" data-action="choose-file">导入交接 JSON</button><input id="file-input" type="file" accept=".json,application/json" hidden></div><details><summary>粘贴交接 JSON</summary><textarea class="json-input" id="handoff-json" aria-label="交接 JSON" spellcheck="false" placeholder='{"requirement": {...}, "drafts": [...]} '></textarea><button class="btn" data-action="import-text">导入粘贴内容</button></details>`;
 if(!project)return html+`<div class="empty"><div class="kicker">READY FOR REVIEW</div><h3>先看依据，再做取舍。</h3><p>使用演示案例检查“停用设备后，已有预约怎么办”，或直接导入上游的需求快照和两组草案。</p></div></section>`;
 const r=project.requirement;
 html+=`<details open><summary>需求快照 ${esc(r.id)} · v${r.version}</summary><pre>${esc(r.markdown)}</pre></details><div>${r.items.map(item=>`<div class="source-row"><strong>${esc(item.id)} · ${esc(item.title)}</strong><p>${esc(item.text)}</p>${refs([item.source.section,`第 ${item.source.start_line}–${item.source.end_line} 行`])}</div>`).join('')}</div></section><section class="panel"><div class="section-top"><h2>两组草案</h2>${badge('同一需求版本')}</div><div class="two-col">`;
 return html+project.drafts.map(d=>`<article class="draft"><div class="draft-title"><span class="letter">${esc(d.id)}</span><h3>${esc(d.title)}</h3></div><p>${esc(d.summary)}</p>${d.claims.map(c=>`<div class="claim">${esc(c.text)}${refs([c.id,...c.requirement_ids])}</div>`).join('')}</article>`).join('')+'</div></section>';
}
function evaluations(){
 if(!project?.evaluations.length)return `<section class="panel"><h2>独立评价</h2><div class="empty"><h3>每组先独立接受评价</h3><p>导入两份草案后，点击右侧“生成独立评价”。每次回调只读取需求和一份草案。</p></div></section>`;
 const labels={value:'用户价值',feasibility:'技术可行性',cost:'成本友好度'};
 return `<section class="panel"><div class="section-top"><div><div class="kicker">02 / EVALUATION</div><h2>评价是依据，不替你做决定。</h2></div>${badge('模拟评价','amber')}</div><div class="notice blue">用户价值分按来源覆盖示范；技术与成本暂用中性值。成本分越高表示越省，分数不自动决定方案去留。</div><div class="two-col">${project.evaluations.map(e=>`<article class="draft"><div class="draft-title"><span class="letter">${esc(e.draft_id)}</span><h3>独立评审结果</h3></div>${e.criteria.map(c=>`<div class="score-row"><div class="score-heading"><strong>${labels[c.criterion]}</strong><span class="score">${c.score}<small> / 5</small></span></div><p>${esc(c.reason)}</p>${refs(c.claim_ids)}</div>`).join('')}</article>`).join('')}</div></section>`;
}
function specView(){
 const spec=activeSpec();
 if(!spec)return `<section class="panel"><h2>方案与决策</h2><div class="empty"><h3>从候选方案走向共同决定</h3><p>完成独立评价，再从右侧选择 A、B 或融合，生成包含来源、取舍和未决事项的草稿。</p></div></section>`;
 const ro=readOnly(), b=buffer;
 let html=`<section class="panel"><div class="section-top"><div><div class="kicker">03 / SPECIFICATION</div><h2>综合方案 · v${spec.version}</h2></div><div>${badge(spec.status==='confirmed'?'已确认':'草稿',spec.status==='confirmed'?'green':'')}${ro?' '+badge('历史只读','amber'):''}</div></div><div class="actions"><label class="muted" for="version-select">查看版本</label><select id="version-select" ${dirty?'disabled':''}><option value="latest" ${!ro?'selected':''}>当前最新 v${project.specification.version}</option>${project.versions.filter(v=>v.version!==project.specification.version).map(v=>`<option value="${v.version}" ${historic?.version===v.version?'selected':''}>v${v.version} · ${v.status==='confirmed'?'已确认':'草稿'}</option>`).join('')}</select></div>`;
 if(ro)html+=`<div class="notice blue">此版本保持只读。返回当前最新版本后可以继续编辑。</div>`;
 else if(spec.status==='confirmed')html+=`<div class="notice blue">本版已确认。修改并保存会创建新的草稿，旧确认结果保留。${esc(spec.confirmed_by)} · ${esc(spec.confirmed_at)}</div>`;
 html+=`<div class="notice">请同时核对正文和结构化决策。未决事项即使随方案确认，也仍可能阻塞对应任务。</div><h3>结构化决策</h3>`;
 html+=b.decisions.length?b.decisions.map((d,i)=>`<article class="editor-card"><div class="row-head"><strong>${esc(d.id)}</strong>${!ro?`<button class="btn small danger" data-action="remove-decision" data-index="${i}">移除决策</button>`:''}</div>${field('decisions',i,'scope','决策范围',d.scope,false,ro)}${field('decisions',i,'choice','采用的规则',d.choice,true,ro)}${field('decisions',i,'reason','采用理由',d.reason,true,ro)}<div class="two-col">${field('decisions',i,'requirement_ids','需求来源（逗号分隔）',d.requirement_ids.join(', '),false,ro)}${field('decisions',i,'draft_ids','草案来源（A / B）',d.draft_ids.join(', '),false,ro)}</div></article>`).join(''):`<p class="muted">暂无已整理的决策，请补充或在未决事项中说明原因。</p>`;
 if(!ro)html+=`<button class="btn small" data-action="add-decision">＋ 添加决策</button>`;
 html+=`<h3 style="margin-top:26px">待处理事项</h3>`;
 html+=b.open_items.length?b.open_items.map((o,i)=>`<article class="editor-card open" data-open-id="${esc(o.id)}"><div class="row-head"><strong>${esc(o.id)}</strong>${badge(o.resolution?'已填写答复':o.blocking?'待决定 · 阻塞相关任务':'待决定',o.resolution?'green':'amber')}</div>${field('open_items',i,'question','问题与选项',o.question,true,ro)}${field('open_items',i,'affected_requirement_ids','影响的需求（逗号分隔）',o.affected_requirement_ids.join(', '),false,ro)}<label class="check"><input type="checkbox" data-collection="open_items" data-index="${i}" data-key="blocking" ${o.blocking?'checked':''} ${ro?'disabled':''}> 未解决时阻塞相关任务</label>${field('open_items',i,'resolution','人工答复（空白表示仍待决定）',o.resolution||'',true,ro)}${!ro?`<button class="btn small" data-action="resolve-decision" data-index="${i}">将答复写入决策并更新正文</button> <button class="btn small danger" data-action="remove-open" data-index="${i}">移除此事项</button>`:''}</article>`).join(''):`<p class="muted">暂无登记的未决事项，仍需人工复查整体方案。</p>`;
 if(!ro)html+=`<button class="btn small" data-action="add-open">＋ 添加待处理事项</button>`;
 html+=`<div class="toolbar"><h3>方案正文 · Markdown</h3>${!ro?'<button class="btn small subtle" data-action="sync-markdown">根据当前决策更新正文</button>':''}</div><label class="muted" for="markdown-editor">正文将随结构化条目一起保存。更新正文按钮会重新生成下面的文本。</label><textarea id="markdown-editor" class="md-editor" ${ro?'disabled':''}>${esc(b.markdown)}</textarea>`;
 const records=project.review_records.filter(r=>r.version===spec.version);
 html+=`<details><summary>本版取舍与复查记录 · ${records.length} 条</summary>${records.map(r=>`<div class="record">${badge(r.action)}${refs(r.source_refs)}<p>${esc(r.reason)}</p></div>`).join('')}${project.findings.filter(f=>f.version===spec.version).map(f=>`<p class="muted">${esc(f.summary)}</p>`).join('')}</details></section>`;
 return html;
}
function historyView(){
 if(!project?.versions.length)return '<section class="panel"><h2>版本与记录</h2><p class="muted">生成第一份草稿后，版本会保留在这里。</p></section>';
 return `<section class="panel"><div class="kicker">04 / HISTORY</div><h2>让过去的判断留在原处。</h2><p class="muted">生成与人工编辑形成新版本；确认登记在对应版本上，旧正文保留。</p>${[...project.versions].reverse().map(v=>`<div class="history-row"><div><strong>v${v.version}</strong> · ${esc(v.id)} ${badge(v.status==='confirmed'?'已确认':'草稿',v.status==='confirmed'?'green':'')}<div class="muted">起点：${v.selection==='merge'?'融合':v.selection+' 组'}</div></div><button class="btn small" data-action="view-version" data-version="${v.version}" ${dirty?'disabled':''}>查看</button></div>`).join('')}<h3 style="margin-top:24px">取舍记录</h3>${[...project.review_records].reverse().map(r=>`<div class="record">${badge(r.action)} <span class="muted">v${r.version}</span>${refs(r.source_refs)}<p>${esc(r.reason)}</p></div>`).join('')}</section>`;
}
function renderSide(){
 const spec=activeSpec(), unresolved=spec?.open_items.filter(x=>x.resolution===null)||[];
 let html=`<div class="kicker">STAGE STEWARD</div><h2>评审与整合主理</h2>${badge(!project?'等待材料':!project.evaluations.length?'准备评审':!spec?'等待生成方案':spec.status==='confirmed'?'已确认':'待人工确认',spec?.status==='confirmed'?'green':'')}<p>${!project?'先导入同版本需求和 A/B 草案，检查引用是否完整。':!project.evaluations.length?'两组已交付。评价分别进行，完成后再比较取舍。':!spec?'选择方案起点，整理可采用的设计与需要人工处理的问题。':`当前方案 v${spec.version}，${unresolved.length} 项待处理。请核对规则与来源后确认。`}</p>`;
 html+=`<div class="rule"><strong style="font-size:13px">当前交接</strong><p>${project?esc(project.requirement.id)+' @ v'+project.requirement.version:'需求快照 ＋ A/B 草案'}<br>↓<br>已确认方案 → 任务分解</p></div>`;
 if(project&&!project.evaluations.length)html+='<button class="btn primary" data-action="evaluate">生成独立评价</button>';
 if(project?.evaluations.length){html+=`<div class="rule"><strong style="font-size:13px">方案起点</strong>${[['A','以 A 为起点'],['B','以 B 为起点'],['merge','融合两组方案']].map(([v,label])=>`<label class="choice"><input type="radio" name="selection" value="${v}" ${selection===v?'checked':''} ${dirty||historic?'disabled':''}>${label}</label>`).join('')}<button class="btn ${!spec?'primary':''}" data-action="propose" ${dirty||historic?'disabled':''}>${project.specification?'重新生成一版草稿':'生成方案草稿'}</button></div>`;}
 if(spec){html+=`<div class="rule">${!historic?`<button class="btn ${dirty?'primary':''}" data-action="save" ${!dirty?'disabled':''}>保存人工编辑为新版本</button><button class="btn primary" data-action="confirm" ${dirty||spec.status!=='draft'?'disabled':''}>确认当前方案</button>`:''}${spec.status==='confirmed'?`<button class="btn" data-action="export-json" ${dirty?'disabled':''}>下载交接 JSON</button><button class="btn" data-action="export-md" ${dirty?'disabled':''}>下载方案 Markdown</button>`:''}${unresolved.length?'<p class="notice">确认保留当前记录，待决事项仍需后续处理。</p>':''}${dirty?'<p class="muted">有未保存编辑。保存后才能确认或导出。</p>':''}</div>`;}
 if(project)html+=`<button class="btn subtle" data-action="refresh">${dirty?'放弃未保存编辑并刷新':'刷新当前快照'}</button>`;
 html+='<details><summary>本轮演示范围</summary><p>默认使用离线模拟回调；来源覆盖不等于方案质量。具体语义、技术与预算由人工复查。公开的方案内容不替代用户的关键业务决定。</p></details>';
 $('supervisor').innerHTML=html;
 renderStewardPanel();
}
function renderStewardPanel() {
 if (!project) return;
 const panel=document.createElement('section');
 panel.className='rule';
 panel.setAttribute('aria-label','主理人检查与干预');
 $('supervisor').append(panel);
 const append=(tag,text,parent=panel)=>{
  const node=document.createElement(tag);
  node.textContent=text;
  parent.append(node);
  return node;
 };
 const control=(text,action,parent=panel)=>{
  const button=append('button',text,parent);
  button.type='button';
  button.className='btn subtle';
  button.dataset.action=action;
  return button;
 };
 append('h3','主理人检查');
 if (buffer && !historic) control('检查当前方案','inspect');
 if (inspection) append('p',dirty?'检查对象：当前未保存的编辑':'检查对象：当前方案 v'+inspection.version);
 const findings=inspection?.findings || (!dirty&&!historic?project.findings:[]);
 if (!findings.length) append('p',dirty?'编辑发生变化。重新检查可核对当前输入。':'生成草稿后检查需求来源和未决事项。');
 for (const finding of findings) {
  const item=append('div','');
  item.className=finding.severity==='info'?'notice blue':'notice';
  append('strong',finding.severity==='error'?'发现问题':finding.severity==='warning'?'待人工处理':'来源检查通过',item);
  append('p',finding.summary,item);
  if (finding.evidence_refs?.length) append('p','依据 '+finding.evidence_refs.join(' · '),item);
  if (finding.suggestion) append('p',finding.suggestion,item);
  if (finding.ref_id) {
   const button=control('定位 '+finding.ref_id,'locate-finding',item);
   button.dataset.refId=finding.ref_id;
  }
 }
 if (!embedded) return;
 const feedback=append('details','');
 append('summary','退回小组补充',feedback);
 if (feedbackNote) feedback.open=true;
 const groupLabel=append('label','返工小组',feedback);
 groupLabel.className='field';
 const select=append('select','',groupLabel);
 for (const draft of project.drafts) {
  const option=append('option',draft.id+' 组',select);
  option.value=draft.id;
 }
 select.value=feedbackGroup;
 select.onchange=()=>{feedbackGroup=select.value;};
 const noteLabel=append('label','返工指令',feedback);
 noteLabel.className='field';
 const note=append('textarea','',noteLabel);
 note.rows=3;
 note.value=feedbackNote;
 note.oninput=()=>{feedbackNote=note.value;};
 control('发送返工指令','return-race',feedback);
}
async function inspectCurrent(){
 await operate(async()=>{
  inspection=await api('/preview/projects/'+project.id+'/actions/inspect',{
   expected_version:buffer.version,markdown:buffer.markdown,decisions:buffer.decisions,open_items:buffer.open_items
  });
  renderSide();
  $('status').textContent='主理检查已完成。';
 });
}
function render(){
 const spec=project?.specification;
 const stage=!project?0:!project.evaluations.length?1:!spec?2:3;
 $('steps').innerHTML=['导入交接','独立评审','方案整合','人工确认'].map((s,i)=>`<div class="step ${i===stage?'active':i<stage?'done':''}" ${i===stage?'aria-current="step"':''}><span class="num">0${i+1}</span><div><strong>${s}</strong><small>${i<stage?'已完成':i===stage?(spec?.status==='confirmed'?'已确认':'当前阶段'):'等待前置'}</small></div></div>`).join('');
 $('project-stamp').textContent=project?project.requirement.id+' · v'+project.requirement.version+'\nPROJECT / '+project.id.slice(0,8):'等待导入交接材料';
 $('tabs').innerHTML=[['handoff','交接材料'],['evaluation','独立评价'],['spec','方案与决策'],['history','版本与记录']].map(([key,label])=>`<button role="tab" aria-selected="${tab===key}" data-action="tab" data-tab="${key}" ${!project&&key!=='handoff'?'disabled':''}>${label}</button>`).join('');
 $('content').innerHTML=({handoff,evaluation:evaluations,spec:specView,history:historyView}[tab])();renderSide();
}
function nextId(rows,prefix){let n=1;while(rows.some(r=>r.id===prefix+String(n).padStart(2,'0')))n++;return prefix+String(n).padStart(2,'0');}
function regenerateMarkdown(){
 const parts=['# 综合开发方案','## 需求原文与约束',project.requirement.markdown,'## 方案决策'];
 for(const d of buffer.decisions)parts.push(`### ${d.id} · ${d.scope}\n${d.choice}\n\n理由：${d.reason}\n\n来源：${[...d.requirement_ids,...d.draft_ids].join('、')}`);
 parts.push('## 待处理事项');
 for(const o of buffer.open_items)parts.push(`- ${o.id} · ${o.question}\n  影响：${o.affected_requirement_ids.join('、')}；${o.blocking?'阻塞相关任务':'非阻塞'}；处理结果：${o.resolution||'待人工决定'}`);
 if(!buffer.open_items.length)parts.push('无已登记的未决事项，仍需人工复查业务语义。');buffer.markdown=parts.join('\n\n');
}
async function viewVersion(version){await operate(async()=>{inspection=null;if(version==='latest'||Number(version)===project.specification.version){historic=null;buffer=clone(project.specification);}else{historic=await api(`/preview/projects/${project.id}/specifications/${project.specification.id}/versions/${version}`);buffer=clone(historic);}dirty=false;tab='spec';render();$('status').textContent=historic?'正在查看历史版本，仅可阅读。':'已返回当前最新版本。';});}
function download(kind){const spec=activeSpec();if(!spec||spec.status!=='confirmed'||dirty)return;const payload={requirement:project.requirement,drafts:project.drafts,evaluations:project.evaluations,specification:spec,review_records:project.review_records.filter(r=>r.version<=spec.version)};const text=kind==='json'?JSON.stringify(payload,null,2):spec.markdown;const url=URL.createObjectURL(new Blob([text],{type:kind==='json'?'application/json':'text/markdown;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download=`review-handoff-${spec.id}-v${spec.version}.${kind==='json'?'json':'md'}`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);$('status').textContent='已导出 v'+spec.version+'，未决事项随方案保留。';}
document.addEventListener('click',async event=>{
 const el=event.target.closest('button[data-action]');if(!el||el.disabled||busy)return;const a=el.dataset.action;
 if(a==='tab'){tab=el.dataset.tab;render();return;}
 if(a==='sample-conflict'||a==='sample-cly')return sample(a==='sample-cly'?'cly':'conflict');
 if(a==='choose-file')return $('file-input').click();
 if(a==='import-text')return importData($('handoff-json').value);
 if(a==='evaluate')return action('evaluate');
 if(a==='propose')return action('propose',{selection,expected_version:project.specification?.version||0});
 if(a==='save')return action('save',{expected_version:buffer.version,markdown:buffer.markdown,decisions:buffer.decisions,open_items:buffer.open_items});
 if(a==='confirm')return action('confirm',{expected_version:project.specification.version});
 if(a==='inspect')return inspectCurrent();
 if(a==='locate-finding'){
  tab='spec';render();
  const target=[...document.querySelectorAll('[data-open-id]')].find(item=>item.dataset.openId===el.dataset.refId);
  target?.querySelector('textarea[data-key=resolution]')?.focus();
  target?.scrollIntoView({block:'center'});
  return;
 }
 if(a==='return-race'){
  $('error').textContent='';
  const note=feedbackNote.trim();
  if(!note){$('error').textContent='请填写返工指令。';return;}
  try {
   window.parent.returnToRace({groupId:feedbackGroup,note,requirement:project.requirement});
   feedbackNote='';
   renderSide();
   $('status').textContent='返工指令已送到赛马主理人，等待人工应用。';
  } catch(error){$('error').textContent=error.message;}
  return;
 }
 if(a==='refresh')return operate(async()=>{setProject(await api('/preview/projects/'+project.id));$('status').textContent='已刷新到最新快照。';});
 if(a==='view-version')return viewVersion(el.dataset.version);
 if(a==='export-json'||a==='export-md')return download(a==='export-json'?'json':'md');
 if(a==='sync-markdown'){regenerateMarkdown();markDirty();render();return;}
 if(a==='add-decision'){buffer.decisions.push({id:nextId(buffer.decisions,'DEC-'),scope:'人工补充',choice:'',reason:'',requirement_ids:[project.requirement.items[0].id],draft_ids:['A','B']});}
 if(a==='remove-decision')buffer.decisions.splice(Number(el.dataset.index),1);
 if(a==='add-open')buffer.open_items.push({id:nextId(buffer.open_items,'OPEN-'),question:'',blocking:true,affected_requirement_ids:[project.requirement.items[0].id],resolution:null});
 if(a==='remove-open')buffer.open_items.splice(Number(el.dataset.index),1);
 if(a==='resolve-decision'){
  const o=buffer.open_items[Number(el.dataset.index)];if(!o.resolution){$('error').textContent='请先填写人工答复，再写入决策。';return;}
  const d=buffer.decisions.find(d=>d.reason===`人工处理 ${o.id}：${o.question}`);
  if(d)d.choice=o.resolution;else buffer.decisions.push({id:nextId(buffer.decisions,'DEC-'),scope:'人工取舍 · '+o.id,choice:o.resolution,reason:`人工处理 ${o.id}：${o.question}`,requirement_ids:[...o.affected_requirement_ids],draft_ids:project.drafts.map(d=>d.id)});
  regenerateMarkdown();
 }
 if(['add-decision','remove-decision','add-open','remove-open','resolve-decision'].includes(a)){markDirty();render();}
});
document.addEventListener('input',event=>{
 const el=event.target;
 if(el.id==='markdown-editor'){buffer.markdown=el.value;markDirty();return;}
 if(el.dataset.collection){const row=buffer[el.dataset.collection][Number(el.dataset.index)],key=el.dataset.key;row[key]=key.endsWith('_ids')?splitRefs(el.value):key==='blocking'?el.checked:key==='resolution'?(el.value.trim()?el.value:null):el.value;markDirty();}
});
document.addEventListener('change',event=>{
 const el=event.target;
 if(el.name==='selection')selection=el.value;
 if(el.id==='version-select')viewVersion(el.value);
 if(el.id==='file-input'&&el.files[0])operate(async()=>{const text=await el.files[0].text();const data=JSON.parse(text.replace(/^\uFEFF/,''));setProject(await api('/preview/projects',data));tab='handoff';render();$('status').textContent='交接 JSON 已导入。';});
});
if (embedded) window.receiveRaceHandoff = async payload => {
 if (busy) throw new Error('评审正在处理，请稍后再交接。');
 const same = project && JSON.stringify([project.requirement,project.drafts])
   === JSON.stringify([payload.requirement,payload.drafts]);
 if (same) return;
 if (dirty) throw new Error('评审页有未保存的编辑，请先保存，再交接新的赛马结果。');
 const accepted = await operate(async()=>{
  setProject(await api('/preview/projects',payload));
  tab='handoff';
  render();
  $('status').textContent='已从赛马接收同版本需求与 A/B 草案。';
 });
 if (!accepted) throw new Error($('error').textContent || '交接失败，请重试。');
};
render();
</script>
</body></html>
