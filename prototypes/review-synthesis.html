<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>评审与方案整合 · 开发流程工作台</title>
  <style>
    :root {
      --ink: #17283d;
      --muted: #657386;
      --navy: #15273f;
      --blue: #245aca;
      --blue-tint: #eaf1ff;
      --line: #dbe2eb;
      --paper: #f5f6f8;
      --amber: #94591d;
      --pale: #fff6e6;
      --green: #28705c;
      --red: #c43235;
      --font: "Inter", "PingFang SC", "Microsoft YaHei UI", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: var(--font); color: var(--ink); background: var(--paper); font-size: 13px; line-height: 1.55; }
    html.embedded header, html.embedded footer { display: none; }
    header {
      background: var(--navy); color: #fff; padding: 12px 20px;
      display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
    }
    main { max-width: 1280px; margin: 0 auto; padding: 16px; }
    .steps {
      display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-bottom: 14px;
    }
    .step {
      background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px;
      font-weight: 600; cursor: pointer; text-align: left;
    }
    .step.active { border-color: var(--blue); background: var(--blue-tint); color: var(--blue); }
    .layout {
      display: grid; grid-template-columns: minmax(0, 1fr) 285px; gap: 16px; align-items: start;
    }
    .workspace, aside {
      background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 16px;
    }
    .two-col { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .card-soft { background: #f8fafd; border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
    .score-row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px dashed var(--line); }
    .btn {
      border: 1px solid #c5d2e3; background: #fff; color: var(--ink); border-radius: 8px;
      padding: 7px 12px; font-weight: 600; cursor: pointer; font-size: 12.5px;
    }
    .btn-primary { background: var(--blue); border-color: var(--blue); color: #fff; }
    .warn { background: #fdeeee; border: 1px solid #f4c2c3; color: var(--red); border-radius: 8px; padding: 8px 10px; margin-bottom: 10px; display: none; }
    footer { text-align: center; padding: 12px; font-size: 11.5px; color: var(--muted); }
    @media (max-width: 960px) {
      .layout { grid-template-columns: 1fr; }
    }
    @media (max-width: 760px) {
      .steps { grid-template-columns: 1fr; }
      .two-col { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <div style="font-size:10px;letter-spacing:.1em;color:#93b4e8;">SE DEVELOPMENT PROCESS AGENT</div>
      <strong style="font-size:16px;">评审与方案整合</strong>
    </div>
    <span id="mode" style="font-size:12px;background:rgba(255,255,255,.14);padding:4px 10px;border-radius:999px;">本地模拟</span>
  </header>

  <main>
    <div id="project-stamp" style="margin-bottom:10px;color:var(--muted);font-size:12px;">当前项目：实验室设备预约 · 盲评阶段</div>
    <nav class="steps" id="steps" aria-label="评审步骤">
      <button class="step active" type="button" data-step="drafts">1. 草案对照</button>
      <button class="step" type="button" data-step="scores">2. 五维盲评</button>
      <button class="step" type="button" data-step="decisions">3. 关键取舍 DEC-01</button>
      <button class="step" type="button" data-step="confirm">4. 确认并移交分解</button>
    </nav>

    <div class="layout">
      <section class="workspace">
        <div id="error-banner" class="warn" role="alert"></div>
        <div id="content"></div>
      </section>
      <aside id="supervisor">
        <div style="font-size:11px;font-weight:700;color:var(--muted);">评审主理 AI</div>
        <h2 style="margin:2px 0 8px;font-size:15px;">方案评审与整合</h2>
        <p style="margin:0 0 12px;color:var(--muted);font-size:12.5px;">独立评估用户价值、可行性与成本，保留关键分歧选项与理由，待人工确认后输出最终方案。</p>
        <div style="display:flex;flex-direction:column;gap:8px;">
          <button id="btn-evaluate" class="btn btn-primary" type="button">执行盲评打分</button>
          <button id="btn-to-planner" class="btn" type="button">移交任务分解</button>
        </div>
      </aside>
    </div>
  </main>

  <footer>开发流程工作台 · 评审与方案整合</footer>

  <script>
    (function () {
      'use strict';
      if (new URLSearchParams(window.location.search).get('embedded') === '1') {
        document.documentElement.classList.add('embedded');
      }
      const q = (id) => document.getElementById(id);
      let currentStep = 'drafts';
      let state = {
        selectedDraftId: 'A',
        dec01: 'A',
        drafts: [
          { id: 'A', title: '方案 A · 独立停用处置服务', summary: '状态约定先行，查询与预约并行，停用处置独立消费预约状态接口。', score: 91 },
          { id: 'B', title: '方案 B · 单服务内聚校验', summary: '单一服务集中实现预约与清理逻辑，存在并行修改同一文件风险。', score: 82 }
        ]
      };

      function showError(msg) {
        const el = q('error-banner');
        el.textContent = msg || '';
        el.style.display = msg ? 'block' : 'none';
      }

      async function api(url, options = {}) {
        const response = await fetch(url, options);
        const text = await response.text();
        let data = null;
        try { data = text ? JSON.parse(text) : {}; } catch (_) { data = null; }
        if (!response.ok) {
          throw new Error((data && (data.error || data.detail)) || `请求失败（HTTP ${response.status}）`);
        }
        if (data && data.mode) {
          q('mode').textContent = data.mode;
          window.parent?.setModelMode?.(data.mode);
        }
        return data || {};
      }

      function render() {
        document.querySelectorAll('#steps .step').forEach(btn => {
          btn.classList.toggle('active', btn.dataset.step === currentStep);
        });
        const host = q('content');
        host.innerHTML = '';

        if (currentStep === 'drafts') {
          const grid = document.createElement('div');
          grid.className = 'two-col';
          state.drafts.forEach(d => {
            const box = document.createElement('div');
            box.className = 'card-soft';
            box.innerHTML = `<strong>${d.title}</strong><p style="margin:6px 0 0;color:var(--muted);">${d.summary}</p>`;
            grid.appendChild(box);
          });
          host.appendChild(grid);
        } else if (currentStep === 'scores') {
          const rows = [
            ['用户价值', '92 / 84'],
            ['工程可行性', '90 / 88'],
            ['改动成本', '85 / 89'],
            ['并行扩展性', '95 / 72'],
            ['风险可控度', '93 / 78']
          ];
          rows.forEach(([label, val]) => {
            const row = document.createElement('div');
            row.className = 'score-row';
            row.innerHTML = `<span>${label}</span><strong>${val}</strong>`;
            host.appendChild(row);
          });
        } else if (currentStep === 'decisions') {
          const p = document.createElement('p');
          p.textContent = 'DEC-01：停用设备已有预约的处置策略选择：';
          const wrap = document.createElement('div');
          wrap.style.cssText = 'display:flex;gap:8px;flex-wrap:wrap;';
          ['A', 'B'].forEach(opt => {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'btn' + (state.dec01 === opt ? ' btn-primary' : '');
            btn.textContent = opt === 'A' ? '采纳方案 A（实时处置）' : '采纳方案 B（定时扫描）';
            btn.onclick = () => { state.dec01 = opt; render(); };
            wrap.appendChild(btn);
          });
          host.append(p, wrap);
        } else {
          const p = document.createElement('p');
          p.textContent = `已选定方案 ${state.dec01} 作为基线开发方案，点击移交任务分解生成 task.md 与 workflow.json。`;
          host.appendChild(p);
        }
      }

      q('steps').addEventListener('click', (e) => {
        const btn = e.target.closest('button[data-step]');
        if (!btn) return;
        currentStep = btn.dataset.step;
        render();
      });

      q('btn-evaluate').addEventListener('click', () => {
        showError('');
        currentStep = 'scores';
        render();
      });

      q('btn-to-planner').addEventListener('click', () => {
        const firstDraftId = state.drafts?.[0]?.id || 'A';
        const ref = { chosen: state.dec01 || firstDraftId, specVersion: 'v1.2' };
        window.parent?.setPlannerSpecification?.(ref);
        window.parent?.openTaskPlanner?.(ref);
      });

      window.receiveRaceHandoff = (payload) => {
        if (payload && Array.isArray(payload.drafts) && payload.drafts.length) {
          state.drafts = payload.drafts.map((d, idx) => ({
            id: d.id || (idx === 0 ? 'A' : 'B'),
            title: d.title || `方案 ${idx + 1}`,
            summary: d.summary || ''
          }));
          state.selectedDraftId = state.drafts?.[0]?.id || 'A';
          render();
        }
      };

      render();
    })();
  </script>
</body>
</html>
