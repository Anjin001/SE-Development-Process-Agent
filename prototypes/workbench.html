<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>开发流程工作台 · 赛马与评审</title>
  <style>
    :root { --navy: #14233b; --line: #dbe3ee; --bg: #eef3f9; --blue: #2558c4; --blue-tint: #eaf1ff; --ink: #17283d; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; font-family: "Inter", "PingFang SC", "Microsoft YaHei UI", system-ui, sans-serif; color: var(--ink); background: var(--bg); }
    body { display: flex; flex-direction: column; }
    header {
      background: var(--navy); color: #fff; padding: 12px 18px;
      display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap;
    }
    main { flex: 1; min-height: 0; display: grid; grid-template-columns: 210px minmax(0, 1fr); }
    nav { background: #fff; border-right: 1px solid var(--line); padding: 12px; display: flex; flex-direction: column; gap: 6px; }
    nav button {
      border: 1px solid transparent; background: transparent; text-align: left; padding: 9px 10px;
      border-radius: 8px; cursor: pointer; font-weight: 600; color: var(--ink);
    }
    nav button.active { background: var(--blue-tint); color: var(--blue); border-color: #c5d9fc; }
    #workspace { position: relative; min-height: 0; }
    iframe { width: 100%; height: 100%; border: 0; background: #fff; }
    iframe[hidden] { display: none; }
    @media (max-width: 780px) {
      main { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
      nav { flex-direction: row; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--line); }
    }
  </style>
</head>
<body>
  <header>
    <strong>开发流程工作台</strong>
    <span id="mode" style="font-size:12px;opacity:.9;">赛马与评审 · 本地模拟</span>
  </header>
  <main>
    <nav aria-label="流程目录">
      <button id="nav-intake" class="active" type="button">1 需求录入与赛马</button>
      <button id="nav-review" type="button">2 评审与整合</button>
    </nav>
    <section id="workspace">
      <iframe id="intake" src="/intake?embedded=1" title="需求与赛马"></iframe>
      <iframe id="review" src="/review?embedded=1" title="评审与整合" hidden></iframe>
    </section>
  </main>

  <script>
    (function () {
      'use strict';
      const intake = document.getElementById('intake');
      const review = document.getElementById('review');
      const navIntake = document.getElementById('nav-intake');
      const navReview = document.getElementById('nav-review');
      const modeEl = document.getElementById('mode');

      function showPanel(which) {
        const isIntake = which === 'intake';
        intake.hidden = !isIntake;
        review.hidden = isIntake;
        navIntake.classList.toggle('active', isIntake);
        navReview.classList.toggle('active', !isIntake);
      }

      navIntake.addEventListener('click', () => showPanel('intake'));
      navReview.addEventListener('click', () => showPanel('review'));

      function safeObserveFrame(frame) {
        frame.addEventListener('load', () => {
          try {
            const body = frame.contentDocument?.body;
            if (!body) return;
            const observer = new MutationObserver(() => {});
            observer.observe(body, { attributes: true, subtree: true, attributeFilter: ['hidden', 'disabled'] });
          } catch (_) {
            // Safely ignore cross-origin or uninitialized document access
          }
        });
      }
      safeObserveFrame(intake);
      safeObserveFrame(review);

      window.setModelMode = (mode) => {
        if (modeEl && mode) modeEl.textContent = `赛马与评审 · ${mode}`;
      };
      window.returnToRace = (payload) => {
        showPanel('intake');
        try {
          intake.contentWindow?.receiveReviewInstruction?.(payload);
        } catch (_) {}
      };
      window.openRaceReview = (payload) => {
        showPanel('review');
        try {
          review.contentWindow?.receiveRaceHandoff?.(payload);
        } catch (_) {}
      };
    })();
  </script>
</body>
</html>
