<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>开发流程工作台 · 需求与赛马</title>
  <style>
    :root {
      --navy: #14233b;
      --ink: #17283d;
      --muted: #5b6d85;
      --line: #dbe3ee;
      --bg: #eef3f9;
      --surface: #ffffff;
      --soft: #f6f9fd;
      --blue: #2558c4;
      --blue-tint: #eaf1ff;
      --green: #167956;
      --amber: #a85b11;
      --red: #c43235;
      --font: "Inter", "PingFang SC", "Microsoft YaHei UI", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: var(--font); color: var(--ink); background: var(--bg); font-size: 13px; line-height: 1.55; }
    html.embedded header { display: none; }
    header {
      background: var(--navy); color: #fff; padding: 12px 20px;
      display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
    }
    header h1 { margin: 0; font-size: 16px; }
    .pill { background: rgba(59,130,246,.22); color: #dbeafe; border: 1px solid rgba(147,197,253,.35); border-radius: 999px; padding: 3px 10px; font-size: 11.5px; }
    main.layout {
      max-width: 1360px; margin: 0 auto; padding: 16px;
      display: grid; grid-template-columns: 190px minmax(0, 1fr) minmax(220px, 260px); gap: 16px; align-items: start;
    }
    nav[aria-label="流程阶段"] {
      background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px;
      display: flex; flex-direction: column; gap: 6px;
    }
    nav a {
      text-decoration: none; color: var(--ink); padding: 8px 10px; border-radius: 8px;
      font-weight: 600; display: flex; align-items: center; justify-content: space-between;
    }
    nav a.active { background: var(--blue-tint); color: var(--blue); }
    nav a[aria-disabled="true"] { opacity: 0.45; pointer-events: none; }
    .card {
      background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 14px;
    }
    .card h2 { margin: 0 0 10px; font-size: 15px; }
    textarea {
      width: 100%; border: 1px solid #c5d2e3; border-radius: 8px; padding: 10px; font-family: inherit; font-size: 13px; resize: vertical;
    }
    .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .draft-box { background: var(--soft); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
    .steward {
      background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px;
      position: sticky; top: 16px;
    }
    .btn {
      border: 1px solid #c5d2e3; background: #fff; color: var(--ink); border-radius: 8px;
      padding: 7px 12px; font-weight: 600; cursor: pointer; font-size: 12.5px;
    }
    .btn-primary { background: var(--blue); border-color: var(--blue); color: #fff; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .warn { background: #fdeeee; border: 1px solid #f4c2c3; color: var(--red); border-radius: 8px; padding: 8px 10px; margin-top: 10px; display: none; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; background: var(--blue-tint); color: var(--blue); font-weight: 600; }
    @media (max-width: 1050px) {
      main.layout { grid-template-columns: 1fr; }
      .steward { position: static; grid-column: auto; }
      nav[aria-label="流程阶段"] { flex-direction: row; flex-wrap: wrap; }
    }
    @media (max-width: 720px) {
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <h1>开发流程工作台 · 需求与赛马</h1>
    <span id="model-status" class="pill">本地模拟</span>
  </header>

  <main class="layout">
    <nav id="stage-nav" aria-label="流程阶段">
      <a id="step-input" href="#requirements" class="active"><span>1. 需求录入</span></a>
      <a id="step-race" href="#race" aria-disabled="true"><span>2. 赛马出案</span></a>
      <a id="step-review" href="#comparison" aria-disabled="true"><span>3. 交接评审</span></a>
    </nav>

    <div>
      <section id="requirements" class="card">
        <h2>需求原文录入</h2>
        <textarea id="req-input" rows="5"># 实验室设备预约
1. 停用设备保留在列表中并显示「停用」状态，隐藏新预约入口。
2. 禁止对停用设备发起新预约。
3. 设备停用后，需自动处置未开始的已有预约并记录审计日志。</textarea>
        <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;">
          <button id="btn-snapshot" class="btn btn-primary" type="button">生成需求快照并启动赛马</button>
          <button id="edit" class="btn" type="button">重置并修改需求</button>
        </div>
        <div id="error-box" class="warn" role="alert"></div>
      </section>

      <section id="race" class="card" hidden>
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
          <h2 style="margin:0;">A / B 组独立赛马草案</h2>
          <span id="progress" class="badge">已完成</span>
        </div>
        <div id="race-grid" class="grid"></div>
      </section>

      <section id="comparison" class="card" hidden>
        <h2>交接至评审与方案整合</h2>
        <p id="handoff-summary" style="color:var(--muted);margin:0 0 12px;">两份独立草案结构已对齐，可移交评审主理 AI 进行五维盲评与取舍。</p>
        <button id="btn-handoff" class="btn btn-primary" type="button">移交评审与整合</button>
      </section>
    </div>

    <aside id="race-steward" class="steward">
      <div style="font-size:11px;font-weight:700;color:var(--muted);">阶段主理 AI</div>
      <h2 style="margin:2px 0 8px;font-size:15px;">需求与赛马主理</h2>
      <p id="steward-hint" style="margin:0 0 12px;color:var(--muted);font-size:12.5px;">提取目标、约束与未决问题，隔离 A/B 两组上下文独立生成方案。</p>
      <div id="steward-controls" style="display:flex;flex-direction:column;gap:8px;">
        <button id="btn-steward-run" class="btn btn-primary" type="button">启动赛马出案</button>
      </div>
    </aside>
  </main>

  <script>
    (function () {
      'use strict';
      if (new URLSearchParams(window.location.search).get('embedded') === '1') {
        document.documentElement.classList.add('embedded');
      }
      const q = (id) => document.getElementById(id);
      let activeController = null;
      let latestPayload = null;

      function showError(msg) {
        const box = q('error-box');
        if (!box) return;
        box.textContent = msg || '';
        box.style.display = msg ? 'block' : 'none';
      }

      async function safeJsonFetch(url, options = {}) {
        const res = await fetch(url, options);
        const text = await res.text();
        let data = null;
        try { data = text ? JSON.parse(text) : {}; } catch (_) { data = null; }
        if (!res.ok) {
          throw new Error((data && (data.error || data.detail)) || `HTTP ${res.status}`);
        }
        return data || {};
      }

      function renderDrafts(drafts) {
        const grid = q('race-grid');
        grid.innerHTML = '';
        drafts.forEach(d => {
          const box = document.createElement('div');
          box.className = 'draft-box';
          const title = document.createElement('strong');
          title.textContent = d.title;
          const summary = document.createElement('p');
          summary.style.margin = '6px 0 0';
          summary.textContent = d.summary;
          box.append(title, summary);
          grid.appendChild(box);
        });
        q('race').hidden = false;
        q('comparison').hidden = false;
        q('step-race').removeAttribute('aria-disabled');
        q('step-review').removeAttribute('aria-disabled');
      }

      async function runRace() {
        showError('');
        if (activeController) activeController.abort();
        activeController = new AbortController();
        const reqText = q('req-input').value.trim();
        if (!reqText) { showError('请先输入需求内容。'); return; }

        try {
          const data = await safeJsonFetch('/preview/snapshot', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ markdown: reqText }),
            signal: activeController.signal
          });
          latestPayload = data;
          const drafts = Array.isArray(data.drafts) && data.drafts.length ? data.drafts : [
            { title: '方案 A · 独立停用处置服务', summary: '基于状态枚举与独立处置模块解耦预约与停用逻辑，便于并行开发。' },
            { title: '方案 B · 单服务内聚校验', summary: '在预约服务内统一处理状态校验与定时清理，前期改动少但路由共享风险较高。' }
          ];
          renderDrafts(drafts);
        } catch (err) {
          if (err.name === 'AbortError') return;
          // Local standalone fallback when preview backend is absent
          latestPayload = {
            markdown: reqText,
            drafts: [
              { title: '方案 A · 独立停用处置服务', summary: '基于状态枚举与独立处置模块解耦预约与停用逻辑，便于并行开发。' },
              { title: '方案 B · 单服务内聚校验', summary: '在预约服务内统一处理状态校验与定时清理，前期改动少但路由共享风险较高。' }
            ]
          };
          renderDrafts(latestPayload.drafts);
        }
      }

      // Safe nav delegation using closest('a')
      q('stage-nav').addEventListener('click', (event) => {
        const link = event.target.closest('a');
        if (!link) return;
        if (link.getAttribute('aria-disabled') === 'true') {
          event.preventDefault();
          return;
        }
        q('stage-nav').querySelectorAll('a').forEach(a => a.classList.remove('active'));
        link.classList.add('active');
      });

      q('btn-snapshot').addEventListener('click', runRace);
      q('btn-steward-run').addEventListener('click', runRace);

      // Abort any in-flight request when resetting
      q('edit').addEventListener('click', () => {
        if (activeController) {
          activeController.abort();
          activeController = null;
        }
        q('race').hidden = true;
        q('comparison').hidden = true;
        q('step-race').setAttribute('aria-disabled', 'true');
        q('step-review').setAttribute('aria-disabled', 'true');
        showError('');
      });

      q('btn-handoff').addEventListener('click', () => {
        window.parent?.openRaceReview?.(latestPayload || { markdown: q('req-input').value });
      });

      window.receiveReviewInstruction = (payload) => {
        if (payload && payload.instruction) {
          q('steward-hint').textContent = `收到评审返工指令：${payload.instruction}`;
        }
      };

      // Safe config fetch with optional chaining for parent call
      safeJsonFetch('/preview/config')
        .then(config => {
          if (config && config.mode) {
            q('model-status').textContent = config.mode;
            if (config.limits) {
              const { max_input_bytes, model_timeout_seconds } = config.limits;
              q('model-status').textContent += ` · 输入上限 ${(max_input_bytes / 1000000).toLocaleString()} MB · 模型超时 ${model_timeout_seconds} 秒`;
            }
            window.parent?.setModelMode?.(config.mode);
          }
        })
        .catch(() => {});
    })();
  </script>
</body>
</html>
