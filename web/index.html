<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SE 开发工作台</title>
  <style>
    :root { --navy: #14233b; --ink: #17283d; --muted: #5b6d85; --line: #dbe3ee; --bg: #eef3f9; --blue: #2558c4; --red: #c43235; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Inter", "PingFang SC", "Microsoft YaHei UI", system-ui, sans-serif; background: var(--bg); color: var(--ink); font-size: 13.5px; line-height: 1.55; }
    header { background: var(--navy); color: #fff; padding: 14px 20px; font-weight: 700; font-size: 16px; }
    main { max-width: 980px; margin: 20px auto; padding: 0 16px; }
    .card { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 14px; }
    textarea { width: 100%; border: 1px solid #c5d2e3; border-radius: 8px; padding: 10px; font-family: inherit; }
    button { border: 1px solid #c5d2e3; background: #fff; color: var(--ink); border-radius: 8px; padding: 7px 12px; font-weight: 600; cursor: pointer; margin: 4px 6px 4px 0; }
    button.primary { background: var(--blue); border-color: var(--blue); color: #fff; }
    .warning { color: var(--red); background: #fdeeee; border: 1px solid #f4c2c3; border-radius: 8px; padding: 8px 10px; display: none; }
    .log { font-family: ui-monospace, monospace; font-size: 12px; background: #f8fafd; border: 1px solid var(--line); border-radius: 8px; padding: 10px; max-height: 220px; overflow: auto; }
  </style>
</head>
<body>
  <header>SE 开发工作台</header>
  <main>
    <section id="intake" class="card">
      <label for="req" style="display:block;font-weight:600;margin-bottom:6px;">需求描述</label>
      <textarea id="req" rows="4"># 实验室设备预约
停用设备保留在列表中并显示状态。禁止对停用设备发起新预约。</textarea>
      <div style="margin-top:10px;">
        <button id="create" class="primary" type="button">生成两份草案</button>
      </div>
      <p id="error" class="warning" role="alert"></p>
    </section>
    <div id="app"></div>
  </main>

  <script>
    (function () {
      'use strict';
      const reqEl = document.getElementById('req');
      const errEl = document.getElementById('error');
      const appEl = document.getElementById('app');
      let project = null;

      function setError(msg) {
        errEl.textContent = msg || '';
        errEl.style.display = msg ? 'block' : 'none';
      }

      function node(tag, text = '', cls = '') {
        const el = document.createElement(tag);
        if (text) el.textContent = text;
        if (cls) el.className = cls;
        return el;
      }

      function button(label, onclick, primary = false) {
        const b = node('button', label, primary ? 'primary' : '');
        b.type = 'button';
        b.addEventListener('click', onclick);
        return b;
      }

      async function call(action, payload = {}) {
        setError('');
        const url = action
          ? `/api/projects/${encodeURIComponent(project.id)}/actions/${encodeURIComponent(action)}`
          : '/api/projects';
        try {
          const res = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          const text = await res.text();
          let data = null;
          try { data = text ? JSON.parse(text) : null; } catch (_) { data = null; }
          if (!res.ok) {
            if (res.status === 404) {
              throw new Error('接口 /api/projects 返回 404：请确认已使用 `python -m se_agent.server` 启动旧版接口，或通过 `python -m se_agent.workbench` 访问新版工作台。');
            }
            throw new Error((data && (data.error || data.detail)) || `请求失败（HTTP ${res.status}）`);
          }
          if (!data) throw new Error('后端返回了非 JSON 响应。');
          project = data;
          render();
        } catch (e) {
          setError(e.message || '网络请求异常');
        }
      }

      function render() {
        appEl.innerHTML = '';
        if (!project) return;

        // Drafts & Scores (with null guards)
        if (Array.isArray(project.drafts) && project.drafts.length) {
          const sec = node('section', '', 'card');
          sec.appendChild(node('h3', '草案与评分'));
          const scores = Array.isArray(project.scores) ? project.scores : [];
          project.drafts.forEach(draft => {
            const score = scores.find(s => s && s.draft_id === draft.id);
            const scoreText = score && score.value !== undefined ? `（评分：${score.value}）` : '（暂无评分）';
            sec.appendChild(node('p', `${draft.id}: ${draft.title || draft.summary || ''} ${scoreText}`));
          });
          sec.appendChild(button('采纳 A', () => call('confirm', { choice: 'A' }), true));
          sec.appendChild(button('采纳 B', () => call('confirm', { choice: 'B' })));
          sec.appendChild(button('整合 A+B', () => call('confirm', { choice: 'merge' })));
          appEl.appendChild(sec);
        }

        // Run controls
        const ctrl = node('section', '', 'card');
        ctrl.appendChild(node('h3', '运行控制'));
        ctrl.appendChild(button('启动运行', () => call('start'), true));
        ctrl.appendChild(button('单步推进', () => call('step')));
        ctrl.appendChild(button('暂停', () => call('pause')));
        ctrl.appendChild(button('继续', () => call('resume')));
        ctrl.appendChild(button('失败重试', () => call('retry')));
        appEl.appendChild(ctrl);

        // Artifact review (with null guard)
        const artifacts = Array.isArray(project.artifacts) ? project.artifacts : [];
        const artifact = artifacts[0] || null;
        if (artifact) {
          const rev = node('section', '', 'card');
          rev.appendChild(node('h3', `交付审阅：${artifact.name || artifact.id || '产物'}`));
          const editor = document.createElement('textarea');
          editor.rows = 4;
          editor.value = artifact.content ?? '';
          rev.appendChild(editor);
          rev.appendChild(button('批准放行', () => call('review', { decision: 'approve', content: editor.value }), true));
          rev.appendChild(button('修订并放行', () => call('review', { decision: 'revise', content: editor.value })));
          rev.appendChild(button('退回重做', () => call('review', { decision: 'reject', content: editor.value })));
          appEl.appendChild(rev);
        }

        // Events
        const events = project.run && Array.isArray(project.run.events) ? project.run.events : [];
        if (events.length) {
          const logCard = node('section', '', 'card');
          logCard.appendChild(node('h3', '运行事件日志'));
          const logBox = node('div', '', 'log');
          events.forEach(ev => {
            logBox.appendChild(node('div', typeof ev === 'string' ? ev : JSON.stringify(ev)));
          });
          logCard.appendChild(logBox);
          appEl.appendChild(logCard);
        }
      }

      document.getElementById('create').addEventListener('click', () => {
        call('', { requirement: reqEl.value });
      });
    })();
  </script>
</body>
</html>
